# DEVELOPMENT VPS via Tailscale/WireGuard private IPv4 only — NOT public multiplayer.
# Set CDR_VPN_IP and CDR_STAFF_TOKEN in .env, then:
# docker compose -f compose.vps.yaml pull && docker compose -f compose.vps.yaml up -d
services:
  volume-init:
    # One-shot volume ownership repair; the game and account API stay non-root.
    image: ${CDR_GAME_SERVER_IMAGE:-ghcr.io/nekosune-gameservers-mp-mods/creative-destruction-reborn/game-server:latest}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "chown -R 10001:10001 /app/reborn/server/logs /app/reborn/server/save"
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    volumes:
      - cdr_logs:/app/reborn/server/logs
      - cdr_save:/app/reborn/server/save
  game-server:
    image: ${CDR_GAME_SERVER_IMAGE:-ghcr.io/nekosune-gameservers-mp-mods/creative-destruction-reborn/game-server:latest}
    depends_on:
      volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      CDR_LANGUAGE: ${CDR_LANGUAGE:-en}
      CDR_ZONE_NAME: ${CDR_ZONE_NAME:-Reborn-Dev}
      CDR_BIND_HOST: 0.0.0.0
      CDR_ADVERTISE_HOST: ${CDR_VPN_IP:?Set private Tailscale or WireGuard IPv4 in .env}
      CDR_ALLOW_REMOTE: "1"
      CDR_MAX_CONNECTIONS: "32"
    ports:
      - "${CDR_VPN_IP:?Set VPN IPv4}:8000:8000/tcp"
      - "${CDR_VPN_IP:?Set VPN IPv4}:4000:4000/tcp"
      - "${CDR_VPN_IP:?Set VPN IPv4}:4001:4001/tcp"
      - "${CDR_VPN_IP:?Set VPN IPv4}:4002:4002/tcp"
    volumes:
      - cdr_logs:/app/reborn/server/logs
      - cdr_save:/app/reborn/server/save
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
  account-api:
    image: ${CDR_ACCOUNT_API_IMAGE:-ghcr.io/nekosune-gameservers-mp-mods/creative-destruction-reborn/account-api:latest}
    depends_on:
      volume-init:
        condition: service_completed_successfully
    command: ["python", "account_api.py"]
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      CDR_AUTH_BIND: 0.0.0.0
      CDR_AUTH_ALLOW_CONTAINER: "1"
      CDR_AUTH_PORT: "8090"
      CDR_ACCOUNT_DB: /app/reborn/server/save/accounts.sqlite3
      CDR_REGISTRATION_KEY: ${CDR_REGISTRATION_KEY:?Set a strong registration secret in .env}
    ports:
      - "127.0.0.1:${CDR_ACCOUNT_HOST_PORT:-8090}:8090/tcp"
    volumes:
      - cdr_save:/app/reborn/server/save
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 256m
  staff:
    image: ${CDR_STAFF_IMAGE:-ghcr.io/nekosune-gameservers-mp-mods/creative-destruction-reborn/staff:latest}
    depends_on:
      volume-init:
        condition: service_completed_successfully
    command: ["python", "staff_dashboard.py"]
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      CDR_STAFF_BIND: 0.0.0.0
      CDR_STAFF_PORT: "8088"
      CDR_STAFF_TOKEN: ${CDR_STAFF_TOKEN:?Set a random 32+ character token in .env}
    ports:
      - "127.0.0.1:${CDR_STAFF_HOST_PORT:-8088}:8088/tcp"
    volumes:
      - cdr_logs:/app/reborn/server/logs:ro
      - cdr_save:/app/reborn/server/save:ro
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 256m
volumes:
  cdr_logs:
  cdr_save:
