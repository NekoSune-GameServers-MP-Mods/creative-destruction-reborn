name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'reborn/server/**'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'reborn/server/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker (linux/amd64, linux/arm64)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Image name (GHCR requires lowercase)
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.description=Creative Destruction Reborn Python server (development; remote game login disabled)
            org.opencontainers.image.licenses=NOASSERTION

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Job summary
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          {
            echo '### Docker image published'
            echo ''
            echo "Image: \`$IMAGE\`"
            echo ''
            echo 'Tags:'
            echo '~~~'
            echo "${{ steps.meta.outputs.tags }}"
            echo '~~~'
            echo ''
            echo 'Platforms: linux/amd64, linux/arm64'
            echo ''
            echo '**Warning:** This is a development server, not secure production multiplayer.'
          } >> "$GITHUB_STEP_SUMMARY"
