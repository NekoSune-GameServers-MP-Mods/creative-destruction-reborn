name: Build and Publish Service Docker Images

on:
  push:
    branches: [main, server, account, staff, cluster-api, cluster-agent]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'reborn/server/**'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'reborn/server/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: "${{ matrix.service }} (amd64 / arm64)"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [game-server, account-api, staff, cluster-api, cluster-agent]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Set lower-case image path
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,prefix=branch-,enable=${{ github.ref != 'refs/heads/main' && github.event_name != 'pull_request' }}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.description=Creative Destruction Reborn ${{ matrix.service }} development service
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: GHCR login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true
