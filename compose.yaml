# Local Docker development ONLY: localhost-published ports prevent public exposure.
services:
  volume-init:
    build: .
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "chown -R 10001:10001 /app/reborn/server/logs /app/reborn/server/save"
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    volumes:
      - cdr_logs:/app/reborn/server/logs
      - cdr_save:/app/reborn/server/save
  creative-destruction-dev:
    build: .
    depends_on:
      volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      CDR_LANGUAGE: ${CDR_LANGUAGE:-en}
      CDR_BIND_HOST: 0.0.0.0
      CDR_ADVERTISE_HOST: 127.0.0.1
      CDR_ALLOW_REMOTE: "1" # Container interface only; host ports below bind localhost.
      CDR_MAX_CONNECTIONS: "32"
    ports:
      - "127.0.0.1:8000:8000/tcp"
      - "127.0.0.1:4000:4000/tcp"
      - "127.0.0.1:4001:4001/tcp"
      - "127.0.0.1:4002:4002/tcp"
    volumes:
      - cdr_logs:/app/reborn/server/logs
      - cdr_save:/app/reborn/server/save
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m

volumes:
  cdr_logs:
  cdr_save:
